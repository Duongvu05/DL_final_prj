[project]
name = "dl_final_prj"
version = "0.1.0"
description = "A modern Python project managed by uv."
readme = "README.md"
requires-python = ">= 3.12"
authors = [
    { name = "Duong Ngoc Vu", email = "11230526@st.neu.edu.vn" }
]
dependencies = [
    "loguru>=0.7.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.5",
    "pandas>=3.1.1",
    "pyyaml>=6.0.3",
    "torch>=2.15.0",
    "torchvision>=0.29.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dl_final_prj"]
include = ["src/dl_final_prj/.agents/**/*"]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "pytest-watch>=4.2.0",
    "pre-commit>=3.7.0",
    "ruff>=0.4.0",
    "pyright>=1.1.360",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "N", "RUF"]
ignore = ["E501", "N802", "N803", "N806", "B905", "SIM108"]

[tool.ruff.lint.isort]
known-first-party = ["dl_final_prj"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "basic"
include = ["src"]
exclude = ["tests"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"
markers = [
    "slow: marks tests as slow (deselect with -m 'not slow')",
    "integration: marks integration tests requiring external resources",
]
