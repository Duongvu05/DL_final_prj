[package]
name = "dlfast"
version = "0.1.0"
edition = "2021"
description = "Rust hot paths for the DL final project (CSV parsing, image letterboxing, block bootstrap, edit distance)"
license = "MIT"

[lib]
name = "dlfast"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.30", features = ["extension-module", "abi3-py312"] }
numpy = "0.30"
rayon = "1.12"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
