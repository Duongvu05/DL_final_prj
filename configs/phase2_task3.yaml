# Phase 2 Task 3, Setting A (oracle GT-box crop) of docs/experiment_plan.md (Sections 2.3
# Phase 2, 3 rows T3-M0..M4, 3.1, 4.4). Data, crop, fit and decoding settings are copied from
# configs/phase1_task3.yaml. Only the models differ (plus `compile`, see below). Runs go to
# results/phase2/runs/task3/<model>/seed<s>. Setting B (whole image, no box) is the companion
# configs/phase2_task3_whole.yaml with the same models.
#
# All models: Phase 1 VGG-BN CNN (512x7x7) -> Linear(512, 128) per token -> learned 2-D
# row/col position embeddings -> token mixer -> Phase 1 2-layer GRU decoder (hidden 256),
# Bahdanau attention over the 49 mixed tokens, length head on the mean token.
#
# Token mixer skeleton (shared by M0 and M1, so M0 vs M1 changes only the sequence operator):
#   2 x [ x + Linear(2*128, 128)(cat[fwd(RMSNorm(x)), flip(bwd(flip(RMSNorm(x))))]) ]
#   -> final RMSNorm. Both directions are fused inside every layer (Vision Mamba style).
#   M0: fwd/bwd are Mamba-1 mixers (d_model 128, d_inner 256, d_state 16, d_conv 4, expand 2).
#   M1: one 1-layer bidirectional nn.GRU per layer.
#
# Trainable parameters (seed independent, see ocr_mamba.MixerAttentionGRURecognizer).
# Plan 2.3 budget, t3_m0 vs the Phase 1 cnn_attention_gru (T3-P0, 6,202,898):
#   t3_m0   6,198,546  -0.07% vs T3-P0
# Controls vs t3_m0 (plan 2.3 and 3.1 ask for every control within 5% of M0):
#   model   total      token mixer  vs t3_m0
#   t3_m0   6,198,546  532,096      0
#   t3_m1   6,197,814  531,364      -0.01%  (BiGRU hidden 141 per layer)
#   t3_m2   6,197,650  531,200      -0.01%  (static dt/B/C + low-rank adapter)
#   t3_m3   6,133,010  466,560      -1.06%  (forward only, 4 layers, see below)
#   t3_m4   6,196,754  532,096      -0.03%  (no position embeddings, -1,792)
# Shared parts: CNN 4,687,296, token projection 65,664, positions 1,792, decoder+heads
# 911,698.
# T3-P0 split: CNN 4,687,296, positions 7,168, decoder+heads 1,508,434 (512-d tokens). So M0
# matches P0 in total only. Attention, the GRU input and init_h read 128-d tokens in M0, and
# about 0.6M parameters move from the decoder and positions into the projection and mixer.
#
# t3_m3. It uses 4 forward layers with the M0 mixer config unchanged (d_inner 256,
# d_state 16). So the per-mixer width, the state size, the number of Mamba mixers (4) and
# their scan FLOPs equal t3_m0, and only the scan direction differs (plus sequential depth,
# and it has no fusion Linear). A 2-layer forward-only stack would be 5,899,794 (-4.82%),
# inside 5% only at the edge and with half the mixers, so it is not used.
#
# compile: true wraps the token mixer of every model here (Mamba and the BiGRU control alike)
# with torch.compile in place (nn.Module.compile) for training and evaluation, on CUDA only.
# It is a no-op on CPU. Checkpoint state_dict keys are the same as eager. A100 benchmark of
# t3_m0 (parallel scan): 104 ms/step eager vs 43 ms/step compiled. Dynamo does not trace
# nn.GRU, so in t3_m1 the cuDNN GRU calls run eager (graph breaks) and only RMSNorm and the
# fusion Linear are compiled. Accuracy is not affected. Train time is compile dependent and
# is not a method comparison (spec.json "compile.eager_in_mixer" and "timing_note").
#
# Scan. `scan: parallel` (log-depth) and `scan: loop` give the same result. Time both on the
# A100 with `scripts/run_ocr.py --bench` before the locked runs and keep the faster one.
title: "Full house-number recognition from cropped SVHN images"
phase: phase2
seeds: [0, 1, 2]
results_root: results
svhn_dir: data/processed/svhn
size: 64
crop: 54
max_len: 5
val_frac: 0.1
batch_size: 64
eval_batch_size: 512
fit: {epochs: 16, patience: 16, lr: 3.0e-4, weight_decay: 1.0e-4, clip: 5.0, schedule: step, step_epoch: 10, step_gamma: 0.1, amp: bf16}
length_loss_weight: 0.2
color_jitter: 0.3
compile: true  # torch.compile the token mixer on CUDA (no-op on CPU), all models alike
models:
  t3_m0:  # proposed: 2 residual bidirectional selective Mamba-1 layers, per-layer fusion
    kind: mamba_attention
    args:
      hidden: 256
      layers: 2
      attn_dim: 256
      emb_dim: 64
      d_model: 128
      pos_emb: true
      mamba: {kind: mamba1, fusion: layer, n_layers: 2, direction: bi, d_state: 16, d_conv: 4, expand: 2, static: false, scan: parallel}
  t3_m1:  # matched control: same skeleton, 2 residual 1-layer BiGRU layers, hidden 141
    kind: gru_mixer_attention
    args:
      hidden: 256
      layers: 2
      attn_dim: 256
      emb_dim: 64
      d_model: 128
      pos_emb: true
      gru_hidden: 141
      gru_layers: 2
      gru_direction: bi
  t3_m2:  # static-state control: input-independent dt, B, C (capacity kept by an adapter)
    kind: mamba_attention
    args:
      hidden: 256
      layers: 2
      attn_dim: 256
      emb_dim: 64
      d_model: 128
      pos_emb: true
      mamba: {kind: mamba1, fusion: layer, n_layers: 2, direction: bi, d_state: 16, d_conv: 4, expand: 2, static: true, scan: parallel}
  t3_m3:  # forward-only raster scan, 4 layers of the unchanged M0 mixer (same mixer count)
    kind: mamba_attention
    args:
      hidden: 256
      layers: 2
      attn_dim: 256
      emb_dim: 64
      d_model: 128
      pos_emb: true
      mamba: {kind: mamba1, fusion: layer, n_layers: 4, direction: forward, d_state: 16, d_conv: 4, expand: 2, static: false, scan: parallel}
  t3_m4:  # t3_m0 without the learned 2-D position embeddings
    kind: mamba_attention
    args:
      hidden: 256
      layers: 2
      attn_dim: 256
      emb_dim: 64
      d_model: 128
      pos_emb: false
      mamba: {kind: mamba1, fusion: layer, n_layers: 2, direction: bi, d_state: 16, d_conv: 4, expand: 2, static: false, scan: parallel}
