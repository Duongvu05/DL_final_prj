# Task 1. Predict the target 2 steps ahead of the current step with an RNN.
seed: 42
data:
  path: data/jena_hourly.csv
  datetime_col: datetime
  datetime_format: null
  feature_cols: null        # null means every numeric column
  pred_column: "T (degC)"
  lookback: 48
  resample: null            # for example "1h" if the CSV is not hourly yet
  offset: 2
  horizon: 1
  train_frac: 0.7
  val_frac: 0.15
  period: 24                # seasonal naive period in steps, null to skip
model:
  hidden: 128
  num_layers: 2
  dropout: 0.2
variants:                   # each entry is trained and tested
  - {name: lstm, cell: lstm, attention: false}
  - {name: lstm_attention, cell: lstm, attention: true}
  - {name: gru, cell: gru, attention: false}
  - {name: gru_attention, cell: gru, attention: true}
train:
  epochs: 15
  lr: 1.0e-3
  batch_size: 64
  clip: 1.0
  patience: 4
  loss: huber
smoke:
  max_rows: 3000
  epochs: 2
output: reports/task1.json
