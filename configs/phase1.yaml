# Phase 1 of docs/experiment_plan.md. Report-required baselines and course models only.
seeds: [0, 1, 2]
results_root: results
electricity_npz: data/processed/electricity_hourly.npz
svhn_dir: data/processed/svhn

task1:
  title: "Two-hour-ahead forecasting of MT_235 electricity load"
  # Target-only seasonal-residual design (plan 1.1, 2.1). Inputs: y, y(s-24), y(s-48),
  # y(s-168) and calendar per step. Output: standardized r = y(t+2) - y(t+2-24).
  lookback: 168
  offsets: [2]
  target_only: true
  batch_size: 256
  eval_batch_size: 2048
  fit: {epochs: 50, patience: 8, lr: 5.0e-4, weight_decay: 1.0e-4, clip: 1.0, schedule: plateau, plateau_patience: 3, plateau_factor: 0.5}
  models:
    bigru_attention:   # course-main seasonal-residual Attentive BiGRU-2
      kind: birnn
      args: {hidden: 64, layers: 2, dropout: 0.2, attention: true, attn_dim: 128, head_dim: 128, cell: gru}
    bigru:             # same residual BiGRU-2 without temporal attention
      kind: birnn
      args: {hidden: 64, layers: 2, dropout: 0.2, attention: false, head_dim: 128, cell: gru}

task2:
  title: "Five-hour-ahead sequence forecasting of MT_235 electricity load"
  # Same inputs as task1. The decoder predicts standardized r(t+h) for h = 1..5.
  lookback: 168
  offsets: [1, 2, 3, 4, 5]
  target_only: true
  batch_size: 128
  eval_batch_size: 2048
  fit: {epochs: 60, patience: 10, lr: 5.0e-4, weight_decay: 1.0e-4, clip: 1.0, schedule: plateau, plateau_patience: 3, plateau_factor: 0.5}
  teacher_forcing: {start: 1.0, end: 1.0, decay_epochs: 1}
  models:
    seq2seq_attention:  # course-main seasonal-residual attentive LSTM encoder-decoder
      kind: seq2seq
      args: {hidden: 64, enc_layers: 2, dropout: 0.2, attention: true, attn_dim: 128, horizon_dim: 16}
    seq2seq:            # same residual encoder-decoder without decoder attention
      kind: seq2seq
      args: {hidden: 64, enc_layers: 2, dropout: 0.2, attention: false, horizon_dim: 16}

# Task 3 settings live in configs/phase1_task3.yaml.
