# Phase 2 of docs/experiment_plan.md. Mamba proposals and Mamba ablations for Tasks 1-2
# (plan Sections 2.1, 2.2 and 3, rows T1-M0..M4 and T2-M0..M4).
# Data, split, loss, optimizer, schedule, train batch size and teacher forcing are copied from
# the Phase 1 task1/task2 blocks of configs/phase1.yaml. Only the models differ, plus
# eval_batch_size 512 (Phase 1 uses 2048). Evaluation has no batch statistics, so this does
# not change any prediction. It caps the transient (batch, heads, 168, 168) fp32 tensors of
# the quadratic SSD form at validation and test time when several jobs share one GPU.
# Run: scripts/run_ts.py --config configs/phase2.yaml --task T --model tT_mK --seed S
# Outputs go to results/phase2/runs/taskT/tT_mK/seedS (smoke runs to results/smoke/phase2).
#
# Trainable parameter counts (11 input channels, 10 target features). Recompute with
# `python -m dl_final_prj.ts_mamba configs/phase2.yaml`. M1 enc_hidden and the M3 and M4
# widths are the values that function's search returns from the M0 args.
#   task1  t1_m0 327,293 | t1_m1 326,341 (-0.29%) | t1_m2 327,781 (+0.15%)
#          t1_m3 329,749 (+0.75%) | t1_m4 321,027 (-1.91%)
#   task2  t2_m0 197,653 | t2_m1 198,049 (+0.20%) | t2_m2 197,897 (+0.12%)
#          t2_m3 198,881 (+0.62%) | t2_m4 196,385 (-0.64%)
# Every ablation stays within the 5% tolerance of plan Sections 3 and 3.1.
# M2 is the full-rank static-state control. A, B and C are learned per head and per state
#   (16 decay modes per head), only their input dependence is removed.
# M3 keeps the 6 Mamba-2 heads and widens each head from 32 to 33 channels (d_inner 198).
#   Without that compensation d_conv=1 gives -1.37% (task1) and -1.13% (task2).
# M4 keeps 32 channels per head and adds heads. T1-M4 (forward only) uses 13 heads
#   (d_inner 416), close to the 2 x 6 heads per layer of the bidirectional M0. T2-M4 (no
#   decoder attention) uses 8 heads (d_inner 256). Unwidened they were -42.6% and -19.9%.
#
# PLAN DEVIATION, budget against Phase 1 (plan 2.1 asks for M0 within 5% of the Phase 1
# GRU count). The plan also fixes d_model=96 and expand=2, and both cannot hold together.
# This config keeps d_model=96 and expand=2, so M0 is larger than the Phase 1 course-main
# models. T1-M0 327,293 vs bigru_attention 171,925 (1.90x). T2-M0 197,653 vs
# seq2seq_attention 110,033 (1.80x). The Mamba claims rest on the matched M0-M1 and M0-M2
# contrasts. A Phase 2 vs Phase 1 comparison must state this size gap and is not a matched
# comparison. A budget-matched alternative would be d_inner 64 (2 heads x 32) for task1,
# about +1.9% vs Phase 1, which needs the lead's decision.
phase: phase2
seeds: [0, 1, 2]
results_root: results
electricity_npz: data/processed/electricity_hourly.npz

task1:
  title: "Two-hour-ahead forecasting of MT_235 electricity load"
  lookback: 168
  offsets: [2]
  target_only: true
  batch_size: 256
  eval_batch_size: 512
  fit: {epochs: 50, patience: 8, lr: 5.0e-4, weight_decay: 1.0e-4, clip: 1.0, schedule: plateau, plateau_patience: 3, plateau_factor: 0.5}
  models:
    t1_m0:   # seasonal-residual Mamba-2-GRU hybrid with attention (proposed)
      kind: mamba_gru
      args: {encoder: mamba, d_model: 96, n_layers: 2, direction: bi, d_state: 16, d_conv: 4, expand: 2, ssm_head_dim: 32, static: false, readout_hidden: 64, dropout: 0.2, attention: true, attn_dim: 128, head_dim: 128}
    t1_m1:   # matched control: input projection + BiGRU-2 (hidden 89) + same readout/attention/head
      kind: mamba_gru
      args: {encoder: bigru, d_model: 96, n_layers: 2, enc_hidden: 89, readout_hidden: 64, dropout: 0.2, attention: true, attn_dim: 128, head_dim: 128}
    t1_m2:   # static-state control, input-independent dt/B/C
      kind: mamba_gru
      args: {encoder: mamba, d_model: 96, n_layers: 2, direction: bi, d_state: 16, d_conv: 4, expand: 2, ssm_head_dim: 32, static: true, readout_hidden: 64, dropout: 0.2, attention: true, attn_dim: 128, head_dim: 128}
    t1_m3:   # no depthwise conv (d_conv=1), compensating width 6 heads x 33
      kind: mamba_gru
      args: {encoder: mamba, d_model: 96, n_layers: 2, direction: bi, d_state: 16, d_conv: 1, expand: 2, ssm_head_dim: 33, d_inner: 198, static: false, readout_hidden: 64, dropout: 0.2, attention: true, attn_dim: 128, head_dim: 128}
    t1_m4:   # forward-only scan, compensating width 13 heads x 32
      kind: mamba_gru
      args: {encoder: mamba, d_model: 96, n_layers: 2, direction: forward, d_state: 16, d_conv: 4, expand: 2, ssm_head_dim: 32, d_inner: 416, static: false, readout_hidden: 64, dropout: 0.2, attention: true, attn_dim: 128, head_dim: 128}

task2:
  title: "Five-hour-ahead sequence forecasting of MT_235 electricity load"
  lookback: 168
  offsets: [1, 2, 3, 4, 5]
  target_only: true
  batch_size: 128
  eval_batch_size: 512
  fit: {epochs: 60, patience: 10, lr: 5.0e-4, weight_decay: 1.0e-4, clip: 1.0, schedule: plateau, plateau_patience: 3, plateau_factor: 0.5}
  teacher_forcing: {start: 1.0, end: 1.0, decay_epochs: 1}
  models:
    t2_m0:   # causal Mamba-2 encoder + Phase 1 attentive LSTM decoder (proposed)
      kind: mamba_seq2seq
      args: {encoder: mamba, d_model: 96, n_layers: 2, d_state: 16, d_conv: 4, expand: 2, ssm_head_dim: 32, static: false, hidden: 64, dropout: 0.2, attention: true, attn_dim: 128, horizon_dim: 16}
    t2_m1:   # matched control: input projection + LSTM-2 encoder (hidden 86) + identical decoder
      kind: mamba_seq2seq
      args: {encoder: lstm, d_model: 96, n_layers: 2, enc_hidden: 86, hidden: 64, dropout: 0.2, attention: true, attn_dim: 128, horizon_dim: 16}
    t2_m2:   # static-state control, input-independent dt/B/C
      kind: mamba_seq2seq
      args: {encoder: mamba, d_model: 96, n_layers: 2, d_state: 16, d_conv: 4, expand: 2, ssm_head_dim: 32, static: true, hidden: 64, dropout: 0.2, attention: true, attn_dim: 128, horizon_dim: 16}
    t2_m3:   # no depthwise conv (d_conv=1), compensating width 6 heads x 33
      kind: mamba_seq2seq
      args: {encoder: mamba, d_model: 96, n_layers: 2, d_state: 16, d_conv: 1, expand: 2, ssm_head_dim: 33, d_inner: 198, static: false, hidden: 64, dropout: 0.2, attention: true, attn_dim: 128, horizon_dim: 16}
    t2_m4:   # M0 without decoder attention, compensating width 8 heads x 32
      kind: mamba_seq2seq
      args: {encoder: mamba, d_model: 96, n_layers: 2, d_state: 16, d_conv: 4, expand: 2, ssm_head_dim: 32, d_inner: 256, static: false, hidden: 64, dropout: 0.2, attention: false, horizon_dim: 16}
