# Task 3 improvement study, Setting A (oracle GT-box crop), docs/experiment_plan.md Section 3.
# Single-factor changes to the Phase 1 cnn_attention_gru (T3-I0), everything else identical to
# configs/phase1_task3.yaml. Results go to results/improve/runs/task3/<model>/seed<s>.
#   i2_rrc  T3-I2  RandomResizedCrop(54, area 0.70-1.00, aspect 3/4-4/3) replaces the translation crop
#   i3_ls   T3-I3  label smoothing 0.05 on the character and length cross-entropies
title: Full house-number recognition from cropped SVHN images
seeds:
- 0
- 1
- 2
results_root: results
svhn_dir: data/processed/svhn
size: 64
crop: 54
max_len: 5
val_frac: 0.1
batch_size: 64
eval_batch_size: 512
fit:
  epochs: 16
  patience: 16
  lr: 0.0003
  weight_decay: 0.0001
  clip: 5.0
  schedule: step
  step_epoch: 10
  step_gamma: 0.1
  amp: bf16
length_loss_weight: 0.2
color_jitter: 0.3
models:
  i2_rrc:
    kind: attention
    args:
      hidden: 256
      layers: 2
      attn_dim: 256
      emb_dim: 64
    data:
      rrc_scale:
      - 0.7
      - 1.0
      rrc_ratio:
      - 0.75
      - 1.3333
  i3_ls:
    kind: attention
    args:
      hidden: 256
      layers: 2
      attn_dim: 256
      emb_dim: 64
      label_smoothing: 0.05
phase: improve
