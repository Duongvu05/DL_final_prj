# Phase 1 Task 3 of docs/experiment_plan.md (Sections 1.2, 2.3, 4.1, 4.4).
# Cropped SVHN protocol: GT union box squared and expanded 1.3x, 64x64 cache,
# random 54x54 crop + ColorJitter for training, center 54x54 crop for evaluation.
title: "Full house-number recognition from cropped SVHN images"
seeds: [0, 1, 2]
results_root: results
svhn_dir: data/processed/svhn
size: 64
crop: 54
max_len: 5
val_frac: 0.1
batch_size: 64
eval_batch_size: 512
fit: {epochs: 16, patience: 16, lr: 3.0e-4, weight_decay: 1.0e-4, clip: 5.0, schedule: step, step_epoch: 10, step_gamma: 0.1, amp: bf16}
length_loss_weight: 0.2
color_jitter: 0.3
models:
  cnn_attention_gru:  # course model: VGG-BN CNN + 2-D positions + Bahdanau attention 2-layer GRU (T3-P0)
    kind: attention
    args: {hidden: 256, layers: 2, attn_dim: 256, emb_dim: 64}
  cnn_pool_gru:       # same CNN and GRU decoder, mean token instead of attention (T3-P1)
    kind: pooled
    args: {hidden: 256, layers: 2, emb_dim: 64}
  multihead_cnn:      # Goodfellow-style length + 5 digit heads (T3-P2)
    kind: multihead
    args: {fc_dim: 1024, dropout: 0.3}
  crnn_ctc:           # CRNN: (2,1) last pooling, 14 steps, BiLSTM, CTC (T3-P3)
    kind: ctc
    args: {hidden: 256, layers: 2}
