# Task 3 with recognizers adapted from clovaai/deep-text-recognition-benchmark.
# The data and train sections match configs/task3.yaml so the numbers are comparable.
seed: 0
data_root: data
report_dir: reports
gpu_mem_gb: 1.8   # hard cap on this process, the GPU is shared

data:
  min_digits: 3
  max_digits: 6
  height: 32
  width: 192
  min_gap: 0
  max_gap: 6
  overlap_prob: 0.1
  max_overlap: 4
  noise_std: 0.05
  max_rotation: 10.0
  val_frac: 0.1
  train_size: 20000
  val_size: 2000
  test_size: 5000
  augment: true

model:
  feature: vgg          # vgg or resnet (CLI flags override)
  sequence: bilstm      # none or bilstm
  prediction: ctc       # ctc or attn
  output_channel: 256   # the original uses 512, halved to fit the shared GPU
  hidden: 256

train:
  batch_size: 64
  lr: 0.0003
  epochs: 10
  patience: 4
  clip: 1.0
  num_workers: 4
