# Task 2. Seq2seq with attention predicting the next 5 steps.
seed: 42
data:
  path: data/jena_hourly.csv
  datetime_col: datetime
  datetime_format: null
  feature_cols: null
  pred_column: "T (degC)"
  lookback: 48
  resample: null
  offset: 1
  horizon: 5
  train_frac: 0.7
  val_frac: 0.15
  period: 24
model:
  hidden: 128
  num_layers: 2
  dropout: 0.2
variants:
  - {name: seq2seq, attention: false}
  - {name: seq2seq_attention, attention: true}
train:
  epochs: 15
  lr: 1.0e-3
  batch_size: 64
  clip: 1.0
  patience: 4
  loss: huber
  tf_start: 1.0             # scheduled sampling, teacher forcing ratio on epoch 1
  tf_decay: 0.8             # multiplied in every epoch
  tf_floor: 0.0
smoke:
  max_rows: 3000
  epochs: 2
output: reports/task2.json
